site_name: Лаборатория документации
site_description: Тестовый сайт MkDocs без внутренних данных
strict: true
theme:
  name: material
  language: ru
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
nav:
  - Главная: index.md
  - Путеводитель: guide.md
  - Галерея: gallery.md
  - Работа с документацией: workflow.md
  - Примеры оформления: examples.md
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
