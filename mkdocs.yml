site_url: https://rkorolev-ppm.github.io/mk-docs_demo/
site_name: Лаборатория документации
site_description: Тестовый сайт MkDocs без внутренних данных
strict: true
theme:
  name: material
  custom_dir: overrides
  language: ru
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
nav:
  - Главная: index.md
  - Путеводитель: guide.md
  - Галерея: gallery.md
  - Работа с документацией: workflow.md
  - Примеры оформления: examples.md
  - Справочник:
      - handbook/index.md
      - Команда:
          - handbook/team/index.md
          - Начало работы:
              - handbook/team/onboarding/index.md
              - Первый день: handbook/team/onboarding/first-day.md
              - Инструменты: handbook/team/onboarding/tools.md
          - Встречи: handbook/team/meetings.md
      - Платформа:
          - handbook/platform/index.md
          - Архитектура: handbook/platform/architecture.md
          - API:
              - handbook/platform/api/index.md
              - Наблюдения: handbook/platform/api/observations.md
              - Ошибки: handbook/platform/api/errors.md
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Верхнее меню и левое дерево nav редактируются независимо.
extra:
  top_navigation:
    - title: Главная
      url: ""
    - title: Путеводитель
      url: guide/
    - title: Галерея
      url: gallery/
    - title: Работа с документацией
      url: workflow/
    - title: Примеры оформления
      url: examples/
